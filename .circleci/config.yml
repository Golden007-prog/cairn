version: 2.1
setup: true
orbs:
  continuation: circleci/continuation@1.1.0
# CircleCI is the CI gate (owner decision, 2026-10-12). It was paused on
# 2026-10-06 (#2277) because an unrecognised path selected every job, Docker
# included; select_checks.py now selects only the policy job for process and
# documentation paths and Docker only for image inputs. Set this false to pause
# again without touching anything else. See docs/runbooks/circleci.md.
parameters:
  circleci_enabled:
    type: boolean
    default: true
jobs:
  select:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - run: python -m pip install PyYAML==6.0.2
      - run: python .circleci/select_checks.py --branch "${CIRCLE_BRANCH:-unknown}"
      - store_artifacts:
          path: /tmp/cairn-selection.json
      - continuation/continue:
          configuration_path: /tmp/cairn-continue.yml
workflows:
  cairn-setup:
    when: << pipeline.parameters.circleci_enabled >>
    jobs:
      - select

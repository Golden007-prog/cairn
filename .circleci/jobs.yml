# GENERATED by scripts/oss/assemble_public_tree.py from the platform repository's .circleci/jobs.yml (#2428).
version: 2.1
commands:
  install-uv:
    steps:
    - run: python -m pip install uv==0.11.9
jobs:
  policy:
    docker:
    - image: cimg/python:3.13
    resource_class: small
    steps:
    - checkout
    - run: python -m pip install pytest==8.4.2 PyYAML==6.0.2
    - run:
        name: Architecture and check-selection refusal tests
        command: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest --noconftest -c /dev/null tests/core/test_architecture_boundaries.py  -q
          --junitxml=/tmp/test-results/policy.xml
    - store_test_results:
        path: /tmp/test-results
  python:
    parameters:
      python-version:
        type: string
        default: '3.13'
    docker:
    - image: cimg/python:<< parameters.python-version >>-node
    resource_class: medium
    environment:
      OPENAI_API_KEY: sk-ci-dummy
      UV_PYTHON: << parameters.python-version >>
    steps:
    - checkout
    - install-uv
    - restore_cache:
        keys:
        - uv-v1-<< parameters.python-version >>-{{ arch }}-{{ checksum "uv.lock" }}
    - run:
        name: Locked install with all CI extras
        command: uv sync --locked --extra dev --extra rag --extra rag-sqlite-vec --extra runtime-sqlite --extra runtime-temporal
          --extra telemetry --extra auth --extra ssh --extra metaflow --extra skypilot
    - save_cache:
        key: uv-v1-<< parameters.python-version >>-{{ arch }}-{{ checksum "uv.lock" }}
        paths:
        - ~/.cache/uv
    - run: uvx ruff check .
    - run:
        name: Full non-DBOS suite
        command: env -u OBS_STORAGE -u CAIRN_STORAGE .venv/bin/pytest -q --no-header -p no:cacheprovider -m "not dbos and
          not timing and not e2e" --junitxml=/tmp/test-results/python.xml
    - run: uvx semgrep --validate --config .semgrep.yml
    - run: uvx semgrep scan --config .semgrep.yml --error --metrics=off src/cairn
    - store_test_results:
        path: /tmp/test-results
  public:
    docker:
    - image: cimg/python:3.13
    resource_class: medium
    environment:
      OPENAI_API_KEY: sk-ci-dummy
      UV_PYTHON: '3.13'
    steps:
    - checkout
    - install-uv
    - restore_cache:
        keys:
        - uv-v1-3.13-{{ arch }}-{{ checksum "uv.lock" }}
    - run:
        name: Locked install of the public set only
        command: uv sync --locked --extra dev --extra rag --extra rag-sqlite-vec --extra runtime-sqlite --extra runtime-temporal
          --extra telemetry --extra auth --extra metaflow --extra skypilot
    - run:
        name: Nothing private is installed
        command: .venv/bin/python scripts/check_public_set.py --extras metaflow,skypilot
    - run:
        name: The optional operator packs' own tests (ADR-0134 D1)
        command: env -u OBS_STORAGE -u CAIRN_STORAGE .venv/bin/pytest -q --no-header -p no:cacheprovider -m "not dbos and
          not timing and not e2e" --junitxml=/tmp/test-results/public-optional.xml packages/cairn-operator-dataflow-metaflow/tests
          packages/cairn-operator-dataflow-skypilot/tests
    - run:
        name: The public core's tests/core files (.circleci/public_core_tests.txt)
        command: env -u OBS_STORAGE -u CAIRN_STORAGE .venv/bin/pytest -q --no-header -p no:cacheprovider -m "not dbos and
          not timing and not e2e" --junitxml=/tmp/test-results/public.xml $(grep -v '^#' .circleci/public_core_tests.txt |
          sed 's|^|tests/core/|')
    - run:
        name: The public CLI and Helm chart tests (tests/cli, tests/deploy)
        command: env -u OBS_STORAGE -u CAIRN_STORAGE .venv/bin/pytest -q --no-header -p no:cacheprovider -m "not dbos and
          not timing and not e2e" --junitxml=/tmp/test-results/public-cli.xml tests/cli tests/deploy
    - run:
        name: The CLI on the public core with the example pack
        command: |
          .venv/bin/cairn --help > /dev/null
          CAIRN_PACK_PATH=examples/hello-cairn .venv/bin/cairn pipeline ls | tee /tmp/pipelines.txt
          grep -q "hello-cairn" /tmp/pipelines.txt
          CAIRN_PACK_PATH=examples/hello-cairn .venv/bin/cairn pipeline explain hello-cairn/profile-and-publish > /dev/null
    - store_test_results:
        path: /tmp/test-results
  public-e2e:
    docker:
    - image: cimg/python:3.13
    - image: pgvector/pgvector:pg16
      environment:
        POSTGRES_USER: cairn
        POSTGRES_PASSWORD: cairn
        POSTGRES_DB: cairn
    resource_class: medium
    environment:
      OPENAI_API_KEY: sk-ci-dummy
      UV_PYTHON: '3.13'
      UV_PYTHON_PREFERENCE: only-managed
      CAIRN_E2E: '1'
      CAIRN_PROOF_PG_DSN: postgres://cairn:cairn@127.0.0.1:5432/cairn
      HELLO_TRAIN_MODEL: sshleifer/tiny-gpt2
    steps:
    - checkout
    - install-uv
    - restore_cache:
        keys:
        - uv-v1-3.13-{{ arch }}-{{ checksum "uv.lock" }}
    - run:
        name: Locked install of the public set with the proof extras (train when the root declares it)
        command: uv sync --locked --extra dev --extra rag --extra rag-sqlite-vec --extra storage-postgres --extra runtime-sqlite
          --extra runtime-postgres --extra runtime-dbos $(grep -q '^train = ' pyproject.toml && echo --extra train)
    - run:
        name: Every matrix and crash cell of the feature proof (tests/e2e/hello)
        command: env -u OBS_STORAGE -u CAIRN_STORAGE .venv/bin/pytest -q --no-header -p no:cacheprovider -rs -m e2e --junitxml=/tmp/test-results/public-e2e.xml
          tests/e2e
    - store_test_results:
        path: /tmp/test-results
  package:
    docker:
    - image: cimg/python:3.13
    resource_class: small
    steps:
    - checkout
    - install-uv
    - run: uv build --all-packages
    - store_artifacts:
        path: dist
  docker:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
    - checkout
    - run: docker build -f Dockerfile.engine -t cairn-engine:ci .
    - run:
        name: Engine discovery and bundled frontend smoke
        command: |
          docker run --rm -e OPENAI_API_KEY=sk-ci-dummy cairn-engine:ci python -c '
          from cairn.core.triggers.main import build_default_runner
          from cairn.core.operator import default_registry, load_all_operators
          runner = build_default_runner()
          load_all_operators(strict=False)
          assert len(default_registry.list_names()) >= 16
          print("Engine discovery passed")'
  ready:
    docker:
    - image: cimg/base:stable
    resource_class: small
    steps:
    - run: echo "All checks selected by cairn-setup succeeded."

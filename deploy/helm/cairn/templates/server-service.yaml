apiVersion: v1
kind: Service
metadata:
  name: {{ include "cairn.fullname" . }}-server
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cairn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cairn.serviceAccountName" . }}
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

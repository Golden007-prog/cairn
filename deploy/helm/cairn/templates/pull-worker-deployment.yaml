{{- if .Values.pullWorker.enabled }}
{{/*
D2 (#565) — a machine that dials OUT: it claims work from the control plane,
runs the image, and reports over the job channel. No inbound access.

This chart ships the DEPLOYMENT SHAPE ONLY. `cairn worker --pull` is being
built in the D2 slice in parallel with this one, so hard-coding its flags here
would bake in a guess; `pullWorker.command` is required and unvalidated
(_helpers.tpl refuses an empty one). When D2 lands, the command becomes a
default here and this comment goes away.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cairn.fullname" . }}-pull-worker
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
    app.kubernetes.io/component: pull-worker
spec:
  replicas: {{ .Values.pullWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "cairn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pull-worker
  template:
    metadata:
      labels:
        {{- include "cairn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pull-worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "cairn.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pull-worker
          image: {{ include "cairn.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.pullWorker.command | nindent 12 }}
          envFrom:
            {{- include "cairn.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.pullWorker.resources | nindent 12 }}
      {{- with .Values.pullWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pullWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pullWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

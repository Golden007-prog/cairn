# GENERATED by scripts/oss/assemble_public_tree.py (ADR-0132 D8).
name: Bug report
description: Something in cairn does not work as documented.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Questions are answered faster in Discussions; a security problem goes to SECURITY.md, never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or request, and what cairn did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest pipeline, flow or pack and the commands that show the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cairn version
      description: The output of `cairn --version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How cairn is installed
      options:
        - pip install cairndev
        - from a clone (uv sync)
        - the light stack (deploy/light)
        - the Helm chart
        - the engine image
        - other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Remove keys, tokens and personal data first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and discussions.
          required: true
        - label: The logs above hold no secret.
          required: true

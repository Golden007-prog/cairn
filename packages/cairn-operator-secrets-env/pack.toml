# obs-operator-secrets-env — declarative manifest.
# Zero-dep env-var SecretStore — the builtin default for the secrets.store
# capability (ADR-0033). Core holds only the SecretStore interface + the
# resolver/scoper; this provider holds the (trivial) env backend. Heavier
# backings (sops+age, OpenBao) ship as separate operator-secrets-* + swap via
# the secrets.store profile binding.

[pack]
name        = "obs-operator-secrets-env"
version     = "0.1.0"
type        = "operator"
description = "Env-var SecretStore — provides the secrets.store capability (zero-dep default)."
kind        = "service_provider"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"

# Dual-purpose like cairn-operator-audit-store: get()/available_keys() back the
# scoped ctx.secrets the runtime injects; run() is a presence-check node path
# that never returns the value.
[operator."secrets/env"]
version       = "0.1.0"
implements    = ["contract://secrets.store/1.0.0"]
input_schema  = "SecretCheckInput"
output_schema = "SecretCheckOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = true
risk      = "read_only"
executors = ["in_process"]

[operator."secrets/env".capabilities]
provides = ["secrets.store"]

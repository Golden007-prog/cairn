# obs-operator-mcp — declarative manifest (§24.20.4).
#
# Universal MCP dispatcher operator. Reference operator pack #1 of the
# Phase-2 set (per architecture_obs_agent_locked.md §9). One operator,
# every server + tool: takes {server, tool, args} and routes through
# the substrate's MCP client (cairn/services/mcp).
#
# Per-tool risk classification is a Phase 3+ policy-layer concern; the
# operator manifest declares a *default* risk for callers that don't
# refine it.

[pack]
name        = "obs-operator-mcp"
version     = "0.1.0"
type        = "operator"
description = "Universal MCP dispatcher — calls any tool on any configured MCP server."
# §Phase-2.1 — locked tier/trust fields. The five reference operators
# (mcp, memory-local, artifact-local, rag-local, state-local) back
# substrate-level services and carry kind=service_provider per the
# locked architecture; domain-specific operator packs (postmortem,
# blast_radius, git, clickstack) use kind=operator.
kind        = "service_provider"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"

[operator."mcp/call"]
version       = "0.1.0"
implements    = ["contract://mcp.call/1.0.0"]
input_schema  = "CallInput"
output_schema = "CallOutput"
# In-process Python — the dispatcher itself runs in the engine process;
# it then routes to whichever MCP server the input names. The "mcp_tool"
# executor exists for operators that *wrap* a specific tool (Phase 3+
# wrappers around frequently-used Slack/GitHub/etc. operations); the
# dispatcher itself is in-process.
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = true
# Conservative default — the dispatcher touches an external system.
# Phase 3+ policy can refine per (server, tool) pair (e.g. slack:list_channels
# is read-only; slack:chat_postMessage is external_write). Stays
# external_write at the static manifest level.
risk      = "external_write"
executors = ["in_process"]

[operator."mcp/call".capabilities]
provides = ["mcp.call"]

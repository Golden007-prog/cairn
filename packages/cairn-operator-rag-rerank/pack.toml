# obs-operator-rag-rerank — declarative manifest (§24.20.4).
#
# Cross-corpus re-ranking (#513, ADR-0061). When a knowledge role composes hits
# from MANY corpora, a single similarity score isn't comparable across corpora;
# this re-scores (query, passage) so one large corpus can't crowd out the rest.
# One verb (rag/rerank) with backends:
#
#   identity      — deterministic score passthrough (sort by existing score).
#                   Always available; the no-extras default + what tests run.
#   cross_encoder — local cross-encoder relevance model ([cross_encoder] extra).
#   cohere        — Cohere Rerank API ([cohere] extra; COHERE_API_KEY).
#
# A missing extra falls back to identity — never a hard failure. The core
# composer (services/rag/inject.py) keeps its own score-fusion fallback, so this
# operator is the pluggable UPGRADE, not a hard dependency.

[pack]
name        = "obs-operator-rag-rerank"
version     = "0.1.0"
type        = "operator"
description = "Cross-corpus re-ranking for RAG hits — identity | cross_encoder | cohere."
kind        = "service_provider"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"


# ─── rag/rerank ───────────────────────────────────────────────────────

[operator."rag/rerank"]
version       = "0.1.0"
implements    = ["contract://rag.rerank/1.0.0"]
input_schema  = "RerankInput"
output_schema = "RerankOutput"
long_running = false
requires_gpu = false
supports_cancel = false
supports_heartbeat = false
supports_mock = true
risk      = "read_only"
executors = ["in_process"]

[operator."rag/rerank".capabilities]
provides = ["rag.rerank"]

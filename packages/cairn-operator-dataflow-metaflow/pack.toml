# cairn-operator-dataflow-metaflow — the Metaflow dataflow engine (ADR-0089), moved out of
# cairn-operator-dataflow into its own optional wheel (ADR-0134 D2, #2678). It registers no
# operator: the `dataflow/run` and `ml/run` operators (cairn-operator-dataflow) submit to it
# when an environment selects `metaflow` as its dataflow_engine / ml_engine.
[pack]
name        = "obs-operator-dataflow-metaflow"
version     = "0.1.0"
type        = "operator"
description = "The Metaflow dataflow engine behind dataflow/run and ml/run (cairndev[metaflow])."
kind        = "service_provider"
publisher   = "cairn"
trust_level = "official"

[compat]
cairn_engine = ">=0.1.0"

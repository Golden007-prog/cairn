# cairn-operator-dataflow-skypilot — the SkyPilot provisioning dataflow engine (ADR-0104 D5),
# moved out of cairn-operator-dataflow into its own optional wheel (ADR-0134 D3a, #2678). It
# registers no operator: the `dataflow/run` and `ml/run` operators (cairn-operator-dataflow)
# submit to it when an environment selects `skypilot` as its dataflow_engine / ml_engine.
[pack]
name        = "obs-operator-dataflow-skypilot"
version     = "0.1.0"
type        = "operator"
description = "The SkyPilot provisioning engine behind dataflow/run and ml/run (cairndev[skypilot])."
kind        = "service_provider"
publisher   = "cairn"
trust_level = "official"

[compat]
cairn_engine = ">=0.1.0"

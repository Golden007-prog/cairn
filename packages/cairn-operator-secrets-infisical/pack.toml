# obs-operator-secrets-infisical — declarative manifest.
#
# Infisical-backed SecretStore: the production swap-in for
# cairn-operator-secrets-env. Same secrets.store capability, same SecretStore
# interface (get / available_keys) — a deployment moves its
# [profile.bindings] "secrets.store" from secrets/env to secrets/infisical
# with no template change. Core holds only the SecretStore interface + the
# resolver/scoper (ADR-0033); this provider holds the Infisical backend.
#
# Config (env), Infisical universal (machine-identity) auth:
#   INFISICAL_CLIENT_ID       (required) — universal-auth machine identity id
#   INFISICAL_CLIENT_SECRET   (required) — universal-auth machine identity secret
#   INFISICAL_PROJECT_ID      (required) — target project id
#   INFISICAL_ENVIRONMENT     (default "dev") — environment slug
#   INFISICAL_SECRET_PATH     (default "/") — secret folder path
#   INFISICAL_HOST            (default "https://app.infisical.com") — site URL
#                             (set for a self-hosted Infisical instance)

[pack]
name        = "obs-operator-secrets-infisical"
version     = "0.1.0"
type        = "operator"
description = "Infisical SecretStore — provides the secrets.store capability (universal-auth machine identity)."
kind        = "service_provider"
# Builtin tier (ADR-0127 D3): ships with the public
# core beside secrets/env. The base import stays SDK-free; the Infisical SDK and a
# server are the optional [infisical] extra + the light stack's `infisical` profile.
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"

# Dual-purpose like cairn-operator-secrets-env: get()/available_keys() back the
# scoped ctx.secrets the runtime injects; run() is a presence-check node path
# that never returns the value.
[operator."secrets/infisical"]
version       = "0.1.0"
implements    = ["contract://secrets.store/1.0.0"]
input_schema  = "SecretCheckInput"
output_schema = "SecretCheckOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = true
risk      = "read_only"
executors = ["in_process"]

[operator."secrets/infisical".capabilities]
provides = ["secrets.store"]

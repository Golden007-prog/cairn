# cairn-operator-monitor-threshold — declarative manifest (ADR-0028, ADR-0076 D4).
#
# The GENERIC data-shaped-trigger primitive: read a numeric metric from a
# pluggable source and compare it to a threshold. Zero-dependency (stdlib only),
# so the base install can do data-driven / drift triggers with no vendor SDK.
# Vendor drift detectors (Evidently, NannyML, whylogs) ship LATER as official
# packs + [extra] providing the SAME `monitor.threshold` capability — this is the
# builtin default; the trigger mechanism (a scheduled skill that files a gated
# proposal past threshold) is the core extension, this operator is the plugin.

[pack]
name        = "obs-operator-monitor-threshold"
version     = "0.1.0"
type        = "operator"
description = "Zero-dep signal/threshold detector — provides the monitor.threshold capability."
kind        = "service_provider"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"

# Reads a metric (inline / JSON file / HTTP GET) and compares to a threshold.
# read_only: it observes a signal, it never mutates. The WATCH is human-gated at
# the template level (a guard + approval), not here.
[operator."monitor/threshold"]
version       = "0.1.0"
implements    = ["contract://monitor.threshold/1.0.0"]
input_schema  = "ThresholdInput"
output_schema = "ThresholdOutput"
long_running  = false
requires_gpu  = false
supports_mock = true
risk          = "read_only"
executors     = ["in_process"]

[operator."monitor/threshold".capabilities]
provides = ["monitor.threshold"]

# The human-gated proposal a crossed watch files. requires_approval=true → the
# durable approval gate fires BEFORE it runs, so the watch pauses awaiting_approval
# with the proposal on the card. Approve → run; reject → the watch ends, no spend.
[operator."monitor/propose"]
version           = "0.1.0"
implements    = ["contract://monitor.propose/1.0.0"]
input_schema      = "ProposeInput"
output_schema     = "ProposeOutput"
long_running      = false
requires_gpu      = false
supports_mock     = false
risk              = "read_only"
requires_approval = true
executors         = ["in_process"]

[operator."monitor/propose".capabilities]
provides = ["monitor.propose"]

# #1162 — launch what the human approved, closing #992's loop. NOT
# requires_approval: the gate already fired on monitor/propose, and asking twice
# for one decision trains people to click through. risk is `paid_compute` because
# this is the step that starts paid work — the launched run keeps its own governance.
[operator."monitor/dispatch"]
version       = "0.1.0"
implements    = ["contract://monitor.dispatch/1.0.0"]
input_schema  = "DispatchInput"
output_schema = "DispatchOutput"
long_running  = false
requires_gpu  = false
supports_mock = true
risk          = "paid_compute"
executors     = ["in_process"]

[operator."monitor/dispatch".capabilities]
provides = ["monitor.dispatch"]

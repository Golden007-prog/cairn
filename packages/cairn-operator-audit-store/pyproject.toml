[project]
name = "cairn-operator-audit-store"
version = "0.1.0"
description = "Zero-dep hash-chained append-only audit sink operator pack (backs audit.sink)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

# Zero dependencies by design — stdlib hashlib/json only. The builtin default
# carries no heavy/vendor SDK (ADR-0027 builtins rule); OTel/immudb/SIEM sinks
# ship as separate official operators.
dependencies = []

[project.entry-points."cairn.operators"]
"audit/store" = "operator_audit_store.operators.audit_store:AuditStoreOp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_audit_store"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_audit_store/pack.toml"

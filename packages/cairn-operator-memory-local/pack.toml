# obs-operator-memory-local — declarative manifest (§24.20.4).
#
# Reference operator pack #2 of the Phase-2 set (per
# architecture_obs_agent_locked.md §9). Local SQLite-vec backed
# memory store — wraps cairn/services/rag/stores/sqlite_vec.py.
# The Qdrant-backed services/memory layer is its own thing (a future
# operator-memory-qdrant pack); this pack is the zero-config dev
# default that ships with the substrate.
#
# Pack-author rationale: services/memory/store.py is currently
# Qdrant-coupled. Rather than refactor that service layer in this
# slice, this operator imports the sqlite_vec backend directly. When
# the memory service is made backend-agnostic (Phase 3 cleanup), this
# operator switches to the higher-level service API; the operator
# manifest stays unchanged.

[pack]
name        = "obs-operator-memory-local"
version     = "0.1.0"
type        = "operator"
description = "Local SQLite-vec backed memory store — provides memory.search + memory.write capabilities."
# §Phase-2.1 — service_provider, not operator. Backs the substrate's
# memory service (per architecture memory §2).
kind        = "service_provider"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"


# ─── memory/search ────────────────────────────────────────────────────

[operator."memory/search"]
version       = "0.1.0"
implements    = ["contract://memory.search/1.0.0"]
input_schema  = "SearchInput"
output_schema = "SearchOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = true
# Search is pure read against a local file — no side effects.
risk      = "read_only"
executors = ["in_process"]

[operator."memory/search".capabilities]
provides = ["memory.search"]


# ─── memory/write ─────────────────────────────────────────────────────

[operator."memory/write"]
version       = "0.1.0"
implements    = ["contract://memory.write/1.0.0"]
input_schema  = "WriteInput"
output_schema = "WriteOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = true
# Writes commit to the local SQLite file. The locked risk enum's closest
# fit is production_mutation (DB write); a future enum extension may
# add a tighter `local_write` value. Phase 3+ policy can refine.
risk      = "production_mutation"
executors = ["in_process"]

[operator."memory/write".capabilities]
provides = ["memory.write"]

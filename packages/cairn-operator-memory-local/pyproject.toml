[project]
name = "cairn-operator-memory-local"
version = "0.1.0"
description = "Local SQLite-vec backed memory store operator pack."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "cairn maintainers"}]
requires-python = ">=3.11"

# cairn itself pulls in sqlite-vec via the `rag` extras when
# RAG_VECTOR_STORE=sqlite_vec is the deploying backend. This operator
# imports services/rag/stores/sqlite_vec.py directly and inherits the
# same dep surface — nothing extra to pin here.
dependencies = []

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

[project.entry-points."cairn.operators"]
"memory/search" = "operator_memory_local.operators.search:SearchOp"
"memory/write"  = "operator_memory_local.operators.write:WriteOp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_memory_local"]
exclude = ["CLAUDE.md", "AGENTS.md"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_memory_local/pack.toml"

# Process files (agent instructions) and tests stay out of the source archive.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "AGENTS.md", "/.claude", "/tests"]

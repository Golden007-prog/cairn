# obs-operator-redact-regex — declarative manifest (§24.20.4 / ADR-0028).
#
# Zero-dependency regex PII/secret redactor. Backs the substrate's `redact`
# service (capability `redact.text`). The detection logic lives in this
# operator pack — core (cairn/core/obs/redact.py) holds only the Redactor
# interface + the LLM-gateway chokepoint. Richer detection ships later as
# `operator-redact-presidio` (official, MIT); this is the builtin default.
#
# Redaction is OPTIONAL (ADR-0028): unless a profile binds `redact.text` to
# this operator, the chokepoint is a no-op. local-dev leaves it unbound.

[pack]
name        = "obs-operator-redact-regex"
version     = "0.1.0"
type        = "operator"
description = "Zero-dep regex PII/secret redactor — provides the redact.text capability."
kind        = "service_provider"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"

# Pure regex over text — no side effects, no external calls. Dispatches
# in-process; also usable as a template `operation` node.
[operator."redact/text"]
version       = "0.1.0"
implements    = ["contract://redact.text/1.0.0"]
input_schema  = "RedactTextInput"
output_schema = "RedactTextOutput"
long_running  = false
requires_gpu  = false
supports_mock = true
risk          = "read_only"
executors     = ["in_process"]

[operator."redact/text".capabilities]
provides = ["redact.text"]

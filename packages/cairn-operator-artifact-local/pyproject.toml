[project]
name = "cairn-operator-artifact-local"
version = "0.1.0"
description = "Local filesystem artifact store operator pack."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "cairn maintainers"}]
requires-python = ">=3.11"

# Pure stdlib — no external deps beyond Python's pathlib + hashlib.
dependencies = []

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

[project.entry-points."cairn.operators"]
"storage/put" = "operator_artifact_local.operators.put:PutOp"
"storage/get" = "operator_artifact_local.operators.get:GetOp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_artifact_local"]
exclude = ["CLAUDE.md", "AGENTS.md"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_artifact_local/pack.toml"

# Process files (agent instructions) and tests stay out of the source archive.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "AGENTS.md", "/.claude", "/tests"]

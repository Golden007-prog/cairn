# obs-operator-artifact-local — declarative manifest (§24.20.4).
#
# Reference operator pack #3 of the Phase-2 set (per
# architecture_obs_agent_locked.md §9). Local filesystem-backed
# artifact store — wraps no external service. Per the locked memory
# §2 ("a tiny local filesystem artifact store can be built-in for dev"),
# the FS implementation lives inside the operator pack itself — there
# is no cairn/services/artifacts/ layer to wrap. Production
# deployments swap to cairn-operator-s3, cairn-operator-gcs, cairn-operator-minio, etc.
#
# Storage root resolves from CAIRN_ARTIFACTS_DIR (default:
# ~/.cairn/artifacts). Per-artifact-name subdirs keep different
# requires.artifacts.<name> declarations from colliding.

[pack]
name        = "obs-operator-artifact-local"
version     = "0.1.0"
type        = "operator"
description = "Local filesystem artifact store — provides storage.put + storage.get capabilities."
# §Phase-2.1 — backs the substrate's artifact service.
kind        = "service_provider"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"


# ─── storage/put ──────────────────────────────────────────────────────

[operator."storage/put"]
version       = "0.1.0"
implements    = ["contract://storage.put/1.0.0"]
input_schema  = "PutInput"
output_schema = "PutOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = true
# Local FS write — matches the postmortem operator's classification
# (external_write) rather than memory.write's production_mutation, since
# neither external SaaS nor a structured DB is touched. Phase 3+ enum
# refinement may introduce a tighter `local_write` value.
risk      = "external_write"
executors = ["in_process"]

[operator."storage/put".capabilities]
provides = ["storage.put"]


# ─── storage/get ──────────────────────────────────────────────────────

[operator."storage/get"]
version       = "0.1.0"
implements    = ["contract://storage.get/1.0.0"]
input_schema  = "GetInput"
output_schema = "GetOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = true
risk      = "read_only"
executors = ["in_process"]

[operator."storage/get".capabilities]
provides = ["storage.get"]

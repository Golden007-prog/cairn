# obs-operator-data-profile — declarative manifest (ADR-0074).
#
# Semantic data profiler: given records + a workflow's DataExpectation (the
# semantic ROLES its operators read), answer "will this data run here?" —
# tiers 1+2, escalating to 3a (per-record) under strictness=strict. The logic
# lives in the shared services layer (cairn/services/data); this operator is a
# thin, dependency-light node so it ships with the base install (a builtin) and
# the Playground/pre-flight can always call it.

[pack]
name        = "obs-operator-data-profile"
version     = "0.1.0"
type        = "operator"
description = "Semantic data profiler — resolve a workflow's data roles, verdict PASS/DEGRADE/BLOCK (ADR-0074)."
kind        = "operator"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"

# Reads + profiles in-memory — no external calls, no writes. side_effect_free
# so it runs LIVE in a Playground sandbox run (ADR-0073 #836).
[operator."data/profile"]
version       = "0.1.0"
implements    = ["contract://data.profile/1.0.0"]
input_schema  = "DataProfileInput"
output_schema = "DataProfileOutput"
long_running  = false
requires_gpu  = false
supports_mock = true
risk          = "read_only"
executors     = ["in_process"]

[operator."data/profile".capabilities]
provides = ["data.profile"]

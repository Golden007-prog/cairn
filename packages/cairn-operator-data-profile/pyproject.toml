[project]
name = "cairn-operator-data-profile"
version = "0.1.0"
description = "Semantic data profiler operator (data/profile) — ADR-0074 tiers 1+2/3a."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "cairn maintainers"}]
requires-python = ">=3.11"

# Zero heavy deps by design (builtin rule): the loader + profiler live in
# cairn.services.data (base). jsonschema (tier 3a) is already a base dep.
dependencies = []

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

[project.entry-points."cairn.operators"]
"data/profile" = "operator_data_profile.operators.profile:DataProfileOp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_data_profile"]
exclude = ["CLAUDE.md", "AGENTS.md"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_data_profile/pack.toml"

# Process files (agent instructions) and tests stay out of the source archive.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "AGENTS.md", "/.claude", "/tests"]

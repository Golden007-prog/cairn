# cairn-operator-remote — generic remote compute over SSH (#70 Axis-2). remote/exec runs
# a command on any box you have SSH access to (raw CPU/GPU), ships files in/out, and
# rides the remote_job lifecycle (submit/pause/poll/resume). Foundation for the NATS
# remote-worker channel (Slice 2). asyncssh = the [ssh] extra; connection = compute.ssh.
[pack]
name        = "obs-operator-remote"
version     = "0.1.0"
type        = "operator"
description = "Run a command/job on any SSH box you own (remote.exec)."
kind        = "operator"
publisher   = "cairn"
trust_level = "official"

[compat]
cairn_engine = ">=0.1.0"

[operator."remote/exec"]
version       = "0.1.0"
implements    = ["contract://remote.exec/1.0.0"]
input_schema  = "RemoteExecInput"
output_schema = "RemoteExecOutput"
long_running       = true
requires_gpu       = false
supports_cancel    = true
supports_heartbeat = false
supports_mock      = true
risk      = "external_write"
executors = ["remote_job", "in_process"]

[operator."remote/exec".capabilities]
provides = ["remote.exec"]

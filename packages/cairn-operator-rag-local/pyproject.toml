[project]
name = "cairn-operator-rag-local"
version = "0.1.0"
description = "Local SQLite-vec backed RAG retrieval operator pack."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "cairn maintainers"}]
requires-python = ">=3.11"

# Same dep surface as cairn-operator-memory-local — wraps services/rag/stores/
# sqlite_vec.py + services/rag/embeddings.py. cairn itself pulls
# sqlite-vec in via the `rag` extras.
dependencies = []

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

[project.entry-points."cairn.operators"]
"rag/search" = "operator_rag_local.operators.search:SearchOp"
"rag/fetch"  = "operator_rag_local.operators.fetch:FetchOp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_rag_local"]
exclude = ["CLAUDE.md", "AGENTS.md"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_rag_local/pack.toml"

# Process files (agent instructions) and tests stay out of the source archive.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "AGENTS.md", "/.claude", "/tests"]

# obs-operator-rag-local — declarative manifest (§24.20.4).
#
# Reference operator pack #4 of the Phase-2 set (per
# architecture_obs_agent_locked.md §9). Local SQLite-vec backed RAG
# retrieval — wraps cairn/services/rag/stores/sqlite_vec.py + the
# substrate embedder.
#
# Naming note: the locked architecture mentioned "rag/sqlite-bm25",
# but services/rag/stores/sqlite_vec.py is dense-vector only today
# (per its own docstring: "Sparse accepted but ignored
# (upstream-in-flight)"). True hybrid BM25 + dense lands when the
# upstream sqlite-vec sparse path stabilises. The operator name +
# capability shape are stable; only the retrieval ranking changes.

[pack]
name        = "obs-operator-rag-local"
version     = "0.1.0"
type        = "operator"
description = "Local SQLite-vec backed RAG retrieval — provides rag.search + rag.fetch."
# §Phase-2.1 — backs the substrate's RAG service.
kind        = "service_provider"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"


# ─── rag/search ───────────────────────────────────────────────────────

[operator."rag/search"]
version       = "0.1.0"
implements    = ["contract://rag.search/1.0.0"]
input_schema  = "SearchInput"
output_schema = "SearchOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = true
# Pure read against a local file — no side effects.
risk      = "read_only"
executors = ["in_process"]

[operator."rag/search".capabilities]
provides = ["rag.search"]


# ─── rag/fetch ────────────────────────────────────────────────────────
#
# Fetches verbatim content for a specific source/id, bypassing the
# similarity ranker. Useful when a previous rag.search hit's id is
# known and the caller wants the full chunk(s) again without re-running
# the search.

[operator."rag/fetch"]
version       = "0.1.0"
implements    = ["contract://rag.fetch/1.0.0"]
input_schema  = "FetchInput"
output_schema = "FetchOutput"
long_running       = false
requires_gpu       = false
supports_cancel    = false
supports_heartbeat = false
supports_mock      = true
risk      = "read_only"
executors = ["in_process"]

[operator."rag/fetch".capabilities]
provides = ["rag.fetch"]

# flows/summarise.yaml — the nightly report's data flow (hello-cairn WP6).
#
# Two builtin stages on the builtin dataflow engine. The public core ships only the
# conformance stages (`noop`, `noop.slow`), so this flow carries the report through
# the engine without transforming it: what it proves is the flow leg itself (engine
# selection, the flow gate on aggregate stage risk, a leg Run and a registered
# artifact in the record). `noop.slow` with a short `seconds` shows a leg that takes
# time and reports progress. Swap in a real kernel once an operator pack provides one.
name: summarise
kind: data
description: >
  Carry the nightly report through the builtin dataflow engine: two conformance
  stages, nothing transformed.
stages:
  - stage: noop
  - stage: noop.slow
    config:
      seconds: 1

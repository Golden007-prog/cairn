# profiles/hello-infisical.toml — hello.toml with secrets in Infisical
# (hello-cairn WP6, ADR-0127 D3).
#
#     export CAIRN_PROFILE=examples/hello-cairn/profiles/hello-infisical.toml
#
# The one difference: `secrets.store` is bound to secrets/infisical
# (cairn-operator-secrets-infisical; its SDK is the `[infisical]` extra), so
# nightly-ops' secret check asks Infisical whether HELLO_REPORT_TOKEN exists. The
# operator reads its connection from the engine's environment: INFISICAL_CLIENT_ID,
# INFISICAL_CLIENT_SECRET and INFISICAL_PROJECT_ID (a universal-auth machine
# identity), INFISICAL_HOST for a self-hosted server, INFISICAL_ENVIRONMENT
# (default "dev"). Needs a reachable Infisical server.

[profile]
visibility = "public"
extends    = "hello.toml"

[profile.bindings]
"secrets.store" = "secrets/infisical"

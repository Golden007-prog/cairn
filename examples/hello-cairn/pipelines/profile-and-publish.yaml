# pipelines/profile-and-publish.yaml — the data pipeline (#2423; extended by
# hello-cairn WP6, ADR-0127 D1).
#
#   profile → data gate → redact → engine-check (flow) → stage → review ⏸
#           → promote ⏸ → publish → audit
#
# Every task and flow leg is its own governed run. Three things stop this pipeline
# for an answer that is not code:
#
#   * `data-ok` is answered by DATA. Its `predicate:` reads the profile leg's
#     output and resolves the moment the profile finishes: true passes with
#     verdict `data`, false is a fail-closed stop (`gate_blocked`).
#   * `review` is answered by a PERSON. The pipeline pauses with the `show:`
#     fields on the approval card until someone approves or rejects it.
#   * `promote` pauses on its own: `artifact/promote` declares
#     `requires_approval`, and a pipeline can add a gate but never remove one an
#     operator declares (ADR-0034). So the tag move is a second, separate decision.
#
# Only builtin operator packs are used: `data/profile` (cairn-operator-data-profile,
# read-only), `redact/text` (cairn-operator-redact-regex), the builtin dataflow
# engine with its `noop` stage (cairn-operator-dataflow), `storage/put`
# (cairn-operator-artifact-local, a local file write under CAIRN_ARTIFACTS_DIR,
# default ~/.cairn/artifacts), `artifact/promote` (cairn-operator-dataflow; moves a
# governed tag in the artifact registry) and `audit/store`
# (cairn-operator-audit-store, a hash-chained audit row).
name: profile-and-publish
kind: pipeline
visibility: public
description: >
  Profile a small JSONL dataset, stop unless the profile passes, redact the
  summary, stage it, and publish it only after a person approves.
outcome: Check a dataset before anything downstream uses it
suite: data

inputs:
  # A path the ENGINE reads. Relative paths resolve against the engine's
  # working directory, so the default works when the engine runs from the
  # repository root (the quickstart does).
  path: {type: str, default: "examples/hello-cairn/data/sample.jsonl", description: "JSONL/CSV/JSON file to profile."}
  min_rows: {type: int, default: 10, description: "The data gate passes only when the profile counts at least this many rows."}
  # What the data must contain, as semantic roles (ADR-0074). An input rather
  # than a literal because `with:` values are lowered through str(); a mapping
  # has to arrive through a wire to reach the operator as a mapping.
  expectation:
    type: dict
    description: "The roles data/profile resolves (see cairn/services/data/profile.py DataExpectation)."
    default:
      kind: rows
      roles:
        - {name: text, required: true, aliases: [body, content]}
        - {name: label, required: true, aliases: [category]}
  tag: {type: str, default: "hello-sample@published", description: "The governed tag `promote` points at the checked dataset."}

governance:
  # The pipeline's spend ceiling, reserved at launch and settled at the end.
  # Nothing here costs money; the budget is declared so the record shows one.
  budget: {usd: 1}
  series: hello
  approvers: data-owners

# How this pipeline starts besides by hand. Declared, never armed by default:
# `enabled: false` keeps a fresh install from starting unattended work; enabling the
# pipeline in a workspace materialises each entry as a paused row an operator turns on.
triggers:
  # A registered dataset gained a version. `every:` is how often the watch looks;
  # `on_change: start` is the one spelling that lets a change start the pipeline
  # without a person (the default, `propose`, files an approval card instead).
  # Core arms it (ADR-0131 D3): the row starts THIS pipeline, and each tick first checks
  # whether the registered dataset gained a version — no change, no run.
  - kind: watch
    source: {kind: dataset, ref: hello-sample}
    every: "*/15 * * * *"
    on_change: start
    enabled: false
    description: "Re-check when the hello-sample dataset gets a new version."
  - kind: schedule
    cron: "0 6 * * 1"
    enabled: false
    description: "Monday 06:00 re-check of the sample (off until someone enables it)."
  # A custom receiver: POST /triggers/hello-sample starts a run.
  - kind: webhook
    source: custom
    path: /triggers/hello-sample
    enabled: false
    description: "Start a check from any system that can POST JSON."

steps:
  # ── look at the data (read-only) ──────────────────────────────────────────
  - id: profile
    label: Profile the dataset
    task: data/profile
    with:
      source: $input.path
      expectation: $input.expectation

  # ── the DATA gate ─────────────────────────────────────────────────────────
  # Reads two fields of data/profile's DataProfileOutput: `verdict`
  # (pass | degrade | block) and `record_count`.
  - gate: data-ok
    depends_on: [profile]
    predicate: steps.profile.verdict == 'pass' && steps.profile.record_count >= input.min_rows

  # ── redact the summary before anything stores it ──────────────────────────
  # The builtin regex recognisers (emails, phone numbers, keys, …) replace each
  # hit with a placeholder; `span_count` says how many were found.
  - id: redact
    label: Redact the profile summary
    task: redact/text
    depends_on: [data-ok]
    with:
      text: $steps.profile.note

  # ── a flow leg ────────────────────────────────────────────────────────────
  # flows/engine-check.yaml: one builtin `noop` stage on the dataflow engine.
  # It transforms nothing; it is here so the record shows a flow leg next to
  # the task legs, and its registered artifact is what `promote` tags.
  - id: engine-check
    label: Run the data flow
    flow: engine-check
    depends_on: [redact]
    with:
      # #2632 — the checked file becomes a version of `hello-sample`, the dataset the
      # `watch` above looks at: a changed sample is a new version.
      source: $input.path
      register: hello-sample

  # ── stage the summary ─────────────────────────────────────────────────────
  - id: stage
    label: Stage the redacted summary
    task: storage/put
    depends_on: [engine-check]
    with:
      store: hello-staging
      key: summary
      content: $steps.redact.text
      content_type: text/plain

  # ── the PERSON gate ───────────────────────────────────────────────────────
  - gate: review
    depends_on: [stage]
    approvers: data-owners
    show:
      - profile.verdict
      - profile.record_count
      - redact.span_count
      - redact.text
      - stage.uri

  # ── promote, an operator-declared gate ────────────────────────────────────
  - id: promote
    label: Tag the checked dataset
    task: artifact/promote
    depends_on: [review]
    with:
      tag: $input.tag
      # The flow leg's first registered artifact. `$steps.<id>.<field>` is a plain
      # path with no indexing, so this one wire uses the `$jmes:` form; a flow
      # leg's stats sit under `findings`.
      artifact_id: '$jmes:steps."engine-check".findings.artifact_ids[0]'
      reason: "profile passed the data gate and a person approved the summary"

  # ── publish, only after approval ──────────────────────────────────────────
  - id: publish
    label: Publish the approved summary
    task: storage/put
    depends_on: [promote]
    # #2605 — on completion the bus carries `dataset.ready` (payload: this leg's
    # output); any pipeline leg declared `trigger: on:dataset.ready` fires on it, and
    # ask-the-docs' `kind: event` trigger starts that pipeline on it (ADR-0131 D4).
    emits: dataset.ready
    with:
      store: hello-published
      key: summary
      content: $steps.redact.text
      content_type: text/plain

  # ── the audit record ──────────────────────────────────────────────────────
  - id: audit
    label: Record the publication
    task: audit/store
    depends_on: [publish]
    with:
      action: hello.dataset.published
      outcome: ok
      actor: data-owners
      target: $steps.publish.uri

outputs:
  verdict: profile.verdict
  staged: stage.uri
  published: publish.uri
  promoted: promote.artifact_id
  audit_hash: audit.hash
